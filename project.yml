# Záložní definice pro XcodeGen (brew install xcodegen; xcodegen generate).
# Použij jen tehdy, když by Xcode odmítl otevřít přibalený Lactus.xcodeproj.
name: Lactus
options:
  bundleIdPrefix: cloud.paja
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: cs
  xcodeVersion: "16.0"
targets:
  Lactus:
    type: application
    platform: iOS
    sources:
      - Lactus
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Lactus
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMotionUsageDescription: Lactus zobrazí kroky, aktivitu a absolutní výšku jen na obrazovce. Nic se neukládá ani neodesílá.
        NSLocationWhenInUseUsageDescription: Lactus zobrazí údaje z GNSS (poloha, přesnost, výška, rychlost) jen na obrazovce. Nic se neukládá ani neodesílá.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.paja.Lactus
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
