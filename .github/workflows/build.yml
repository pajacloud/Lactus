name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -project Lactus.xcodeproj -list

      - name: Build for iPhone (unsigned)
        run: |
          rc=0
          xcodebuild \
            -project Lactus.xcodeproj \
            -target Lactus \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || rc=$?
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          if [ "$rc" -ne 0 ] || ! grep -q "BUILD SUCCEEDED" xcodebuild.log; then
            echo "::error::xcodebuild failed (exit $rc)"
            tail -n 80 xcodebuild.log
            exit 1
          fi
          test -x build/Release-iphoneos/Lactus.app/Lactus

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Lactus.app Payload/
          zip -qry Lactus-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Lactus-unsigned-ipa
          path: Lactus-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
